services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432" # host access for psql debugging; API uses the compose network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      APP_DATABASE_URL: postgres://app_user:app_user@db:5432/postgres
      JWT_SECRET: local-dev-secret-change-me
      PHOTOS_DIR: /data/photos
      SQL_DIR: /app/db
      APP_BASE_URL: http://localhost:5173
    volumes:
      - photos:/data/photos
      - ./db:/app/db:ro # live-edit migrations without rebuilding
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      BACKUP_DIR: /backups
      RETENTION_DAYS: "14"
      BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/scripts/pg-backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  photos:
  backups:
